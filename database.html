<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1280">
    <title>Omnibus</title>
    <meta name="description" content="Omnibus helpt auditors en onderzoekers een referentiekader samen te stellen: kies normen en toetspunten uit rapporten, wetten, kaders en modellen, koppel onderzoeksvragen en exporteer naar Excel. Voor toetsingskader, normenkader, IT-audit en operational audit.">
    <meta property="og:title" content="Omnibus · referentiekader, normen en onderzoeksvragen">
    <meta property="og:description" content="Stel een referentiekader samen met normen uit echte rapporten, wetten en kaders, koppel onderzoeksvragen en exporteer naar Excel.">
    <meta property="og:type" content="website">
    <link rel="icon" href="data:,">
    <style>
      /* Openingsscherm vóór de app geladen is: zelfde kleuren en letters als de app (B-096). */
      #startup-shell{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
        background:linear-gradient(180deg,#f4f7fb 0%,#eef1f6 45%,#e6ebf3 100%);color:#525d6b;font:14px/1.4 Inter,system-ui,sans-serif}
      #startup-shell .startup-mark{font:600 1.75rem/1 Spectral,Georgia,serif;color:#154273;letter-spacing:-.015em}
      #startup-shell .startup-bar{position:relative;width:180px;height:3px;border-radius:3px;background:#dce3ec;overflow:hidden}
      #startup-shell .startup-bar::after{content:"";position:absolute;inset:0;width:40%;border-radius:3px;background:#01689b;animation:startup-run 1.1s ease-in-out infinite}
      @keyframes startup-run{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
      @media (prefers-color-scheme:dark){#startup-shell{background:#15202d;color:#b7c3d1}#startup-shell .startup-mark{color:#e6eef7}#startup-shell .startup-bar{background:#2a3a4c}#startup-shell .startup-bar::after{background:#83caf3}}
      @media (prefers-reduced-motion:reduce){#startup-shell .startup-bar::after{animation:none;width:100%;opacity:.5}}
    </style>
  </head>
  <body>
    <div id="root"><div id="startup-shell" role="status"><span class="startup-mark">Omnibus</span><span class="startup-bar" aria-hidden="true"></span><span>Omnibus wordt geopend…</span></div></div>
    <noscript>JavaScript is nodig om Omnibus te gebruiken.</noscript>
    <script type="module" src="/offline.tsx"></script>
  </body>
</html>
