name: Voortgang bijwerken

# Houdt de voortgangspagina's bij: wie welke bron heeft geclaimd (check-out),
# wat is ingeleverd (check-in) en wat in de database zit.
on:
  issues:
    types: [opened, edited, closed, reopened]
  issue_comment:
    types: [created]
  push:
    branches: [main]
    paths: ['.github/voortgang/**', '.github/scripts/voortgang*.mjs', '.github/workflows/voortgang.yml']
  workflow_dispatch:
  schedule:
    # Elke maandagochtend: herinneringen en verlopen claims.
    - cron: '17 6 * * 1'

permissions:
  contents: write
  issues: write

concurrency:
  group: voortgang
  cancel-in-progress: false

jobs:
  bijwerken:
    if: github.event_name != 'issue_comment' || contains(github.event.issue.labels.*.name, 'claim')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.17.0'
          package-manager-cache: false
      - name: Tests van het claimsysteem
        run: node --test .github/scripts/voortgang.test.mjs
      - name: Claims verwerken en pagina's opnieuw maken
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/voortgang.mjs
      - name: Wijzigingen opslaan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs README.md
          if git diff --cached --quiet; then echo "Geen wijzigingen"; exit 0; fi
          git commit -m "Voortgang bijgewerkt"
          git pull --rebase --quiet
          git push
