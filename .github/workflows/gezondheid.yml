name: Online versie controleren

# Controleert elk kwartier of omnibus.rijksmap.nl gezond is (#281). Na drie mislukte
# pogingen komt er één issue met het label 'storing'; GitHub mailt de beheerder.
# Is de site weer gezond, dan sluit het issue vanzelf. Zie .github/scripts/gezondheid.mjs.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: gezondheid
  cancel-in-progress: false

jobs:
  gezondheid:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Code ophalen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node instellen
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Online versie controleren en het issue bijwerken
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/gezondheid.mjs --issue
