name: Kwaliteitsmeting

# Meet de inhoudskwaliteit van de openbare database (B-028): bronpassages die letterlijk
# kloppen en vragen zonder vormfout. Draait als de code naar een nieuwe database wijst,
# en elke maand als extra controle. Werkt docs/beheer/kwaliteitsmeting.md en de badge
# in README.md bij. Zie scripts/kwaliteitsmeting.mjs.
on:
  push:
    branches: [main]
    paths: ['scripts/database-release.mjs', 'scripts/kwaliteitsmeting.mjs', '.github/workflows/kwaliteit.yml']
  schedule:
    - cron: '41 5 3 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kwaliteit
  cancel-in-progress: false

jobs:
  meten:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Tests van de meting
        run: node --test scripts/kwaliteitsmeting.test.mjs
      - name: Database ophalen en meten
        run: node scripts/kwaliteitsmeting.mjs
      - name: Wijzigingen opslaan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/beheer/kwaliteitsmeting.md README.md
          if git diff --cached --quiet; then echo "Geen wijzigingen"; exit 0; fi
          git commit -m "Kwaliteitsmeting bijgewerkt"
          for poging in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
