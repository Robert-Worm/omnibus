name: Code-only checks (manual)

# Preparation only: confirm Actions availability and free usage before dispatch.
# No push/PR/schedule trigger, private publication, secrets or deployment.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-only-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the code and its history for the boundary check
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          set-safe-directory: false
      - name: Set up the verified Node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Install the lockfile without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check application types
        run: npm run check:types
      - name: Lint the supported application surface
        run: npm run lint
      - name: Check frontend contracts
        run: npm run test:frontend
      - name: Check the code and data boundary and synthetic project fixtures
        run: npm run test:code-only
      - name: Check runtime guards with synthetic publications
        run: npm run test:runtime
      - name: Check dependency inventory generation
        run: npm run test:release
      - name: Check local MCP input contracts without private content
        run: npm run test:agent:input
      - name: Check review planning and certainty signals with synthetic content
        run: npm run test:review-tools
